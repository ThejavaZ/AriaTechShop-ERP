  name: Lint Check

  on:
    push:
      branches: [ "**" ]
    pull_request:
      branches: [ main ]

  jobs:
    lint:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - uses: actions/setup-node@v3
          with:
            node-version: '18'
        - run: npm install eslint@8 --save-dev
        - run: npx eslint server/resources/js/
