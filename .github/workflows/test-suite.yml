name: Test Suite (Pest) + Reporte JUnit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, curl, libxml, sqlite3, pdo_sqlite
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: server/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          cd server
          composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cd server
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run Test Suite (junit)
        run: |
          cd server
          mkdir -p tests-report
          php artisan test --log-junit=tests-report/junit.xml

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: server/tests-report/junit.xml

      - name: Publish Summary
        if: always()
        run: |
          echo "## Resultado del Test Suite" >> $GITHUB_STEP_SUMMARY
          echo "- Artefacto: \`junit-report\` (JUnit XML)" >> $GITHUB_STEP_SUMMARY
          echo "- Ver detalle del plan en \`docs/plan-de-pruebas.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ver reporte en \`docs/test-suite-report.md\`" >> $GITHUB_STEP_SUMMARY